name: Remote Server Deployment
run-name: "Action trigged by ${{ github.actor }}"
on:
    push:
        branches:
            - main
jobs:
    deploy:
        env:
            DEPLOY_PATH: "/dev/shm/temp/test/"
        runs-on: ubuntu-latest
        steps:  
            # 1. Downloads repository onto the runner
            - name: Check out repository code
              uses: actions/checkout@v7
              with:
                  path: "$DEPLOY_PATH"
                  # fetch-depth: 0
                  # submodules: true # or 'recursive'
            
            # 2. Subsequent step(s) - see, $GITHUB_WORKSPACE directory
            - name: Run Tests
              working-directory: "$DEPLOY_PATH"
              run: |
                  echo "$GITHUB_WORKSPACE"
                  cp -Rv . "$DEPLOY_PATH"
                  cd -v "$DEPLOY_PATH"
                  python test.py
                  echo "---------done"

