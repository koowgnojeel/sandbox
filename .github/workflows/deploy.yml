name: Run simple commands in Ubuntu
on: [push]
jobs:
    exec-script:
        runs-on: ubuntu-latest
        steps:  
            - name: Run SSH command via native shell
              run: |
                # Ensure the SSH private key is properly configured first
                ssh -p 2202 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /dev/shm && touch ok"
