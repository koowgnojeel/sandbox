name: Remote Server Deployment
on:
    push:
        branches:
            - main
jobs:
    exec-script:
        runs-on: ubuntu-latest
        steps:  
          - name: clone and run using ssh
            uses: appleboy/ssh-action@v1.0.3  
            with:  
              host: ${{ secrets.SSH_HOST }}
              username: ${{ secrets.SSH_USER }}
              key: ${{ secrets.SSH_KEY }}
              port: 2202        # ${{ secrets.SSH_PORT }}
              script_stop: true # Stops execution if a command fails
              script: |  
                cd /dev/shm/temp/sandbox/
                git pull origin main
                python test.py

