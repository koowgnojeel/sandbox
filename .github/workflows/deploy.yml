# * Actions secrets and variables 정의
#     * SSH_HOST
#     * SSH_USER
#     * SSH_KEY  ; SSH private key
#     * SSH_PORT
# 
# * dev-1
#   .../dev1
# 
# * dev-2
#   .../dev2
# 
# * deploy path
#   .../test
name: Remote Server Deployment
run-name: "Action trigged by ${{ github.actor }}"
on:
    push:
        branches:
            - main
jobs:
    deploy:
        env:
            # 환경변수 정의
            DEPLOY_PATH: "/dev/shm/temp/test/"
        runs-on: ubuntu-latest
        steps:  
            # ---------------------------------------------
            # This works on GitHub-hosted virtual machines.
            # ---------------------------------------------
            # # 1. Downloads repository onto the runner
            # - name: Check out repository code
            #   uses: actions/checkout@main
            #   with:
            #       path: "$DEPLOY_PATH"
            #       fetch-depth: 0
            #       submodules: true # or 'recursive'
            # 
            # # 2. Subsequent step(s) - see, $GITHUB_WORKSPACE directory
            # # $GITHUB_WORKSPACE == /home/runner/work/sandbox/sandbox
            # - name: Run Tests
            #   working-directory: "$DEPLOY_PATH"
            #   run: |
            #       hostname
            #       pwd

            - name: Execute remote SSH commands
              uses: appleboy/ssh-action@v1.0.3  
              with:  
                    host: ${{ secrets.SSH_HOST }}
                    username: ${{ secrets.SSH_USER }}
                    key: ${{ secrets.SSH_KEY }}
                    port: ${{ secrets.SSH_PORT }}
                    envs: DEPLOY_PATH
                    timeout: 60s
                    script_stop: true  # Stops execution if a command fails
                    script: |  
                        echo "Starting the CI pipeline..."

                        echo "github.event_name : "               ${{ github.event_name }}
                        echo "runner.os : "                       ${{ runner.os }}
                        echo "github.ref : "                      ${{ github.ref }}
                        echo "github.repository : "               ${{ github.repository }}
                        echo "github.repository : "               ${{ github.repository }}
                        echo "github.workspace : "                ${{ github.workspace }}
                        echo "job.status : "                      ${{ job.status }}
                        echo "steps.remote_ssh.outputs.stdout : " ${{ steps.remote_ssh.outputs.stdout }}

                        mv -v "$DEPLOY_PATH" $(date +"%d%m%Y%H%M%S")
                        mkdir -p "$DEPLOY_PATH"
                        cd "$DEPLOY_PATH"
                        pwd
                        # TODO - set env - "$GITHUB_REPOSITORY"
                        # git clone https://github.com/koowgnojeel/sandbox.git
                        # git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
                        # (x) git pull origin main

                        # pip install -r requirements.txt
                        # python test.py
                        echo "Pipeline finished successfully!"

